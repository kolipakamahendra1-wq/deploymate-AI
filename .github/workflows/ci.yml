name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Evaluation (fails the build if a guardrail metric regresses)
        run: |
          python -m backend.evaluation.run_eval
          python - <<'EOF'
          import json, sys
          r = json.load(open("generated/eval_report.json"))
          floors = {"missing_question_recall": 0.9, "architecture_valid": 1.0, "test_coverage": 0.95}
          bad = {k: r["summary"][k] for k, v in floors.items() if r["summary"][k] < v}
          if r["critic_accuracy"] < 1.0:
              bad["critic_accuracy"] = r["critic_accuracy"]
          sys.exit(f"regressed: {bad}" if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: generated/eval_report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  stack:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CPU runners cannot serve the local model in reasonable time; the smoke test checks
    # the wiring (nginx -> API -> Postgres/pgvector) with the offline agents instead.
    env:
      LLM_PROVIDER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the compose stack (Postgres + pgvector, API, nginx)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx
        timeout-minutes: 5
        run: |
          c="curl -fsS --max-time 120"
          $c localhost:8080/ > /dev/null
          $c localhost:8080/api/health
          id=$($c localhost:8080/api/demo | $c -H 'Content-Type: application/json' -d @- localhost:8080/api/customers | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          $c -X POST localhost:8080/api/customers/$id/run | grep -q finished
          $c localhost:8080/api/customers/$id/patterns | grep -q webhook-queue
      - if: always()
        run: docker compose logs --no-color | tail -100
