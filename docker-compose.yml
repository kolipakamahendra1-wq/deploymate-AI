# Local stack: PostgreSQL with pgvector, Ollama (free local model), the API and the built frontend.
#   docker compose up --build   ->   http://localhost:8080
# The first start downloads the model (qwen2.5:3b is about 1.9 GB) into the ollama volume.
# Pick a smaller model with OLLAMA_MODEL=qwen2.5:1.5b, or run without a model:
#   LLM_PROVIDER= docker compose up --build   (agents run offline)
# The database password defaults to a local-only value; set POSTGRES_PASSWORD for anything beyond a laptop.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deploymate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploymate-local}
      POSTGRES_DB: deploymate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploymate"]
      interval: 5s
      retries: 10

  ollama:
    build:
      context: .
      dockerfile: infrastructure/ollama.Dockerfile
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ollama:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://deploymate:${POSTGRES_PASSWORD:-deploymate-local}@db:5432/deploymate
      CORS_ORIGINS: http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
