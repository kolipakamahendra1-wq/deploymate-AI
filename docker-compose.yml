# Local stack: PostgreSQL with pgvector, the API, and the built frontend.
#   docker compose up --build   ->   http://localhost:8080
# The database password defaults to a local-only value; set POSTGRES_PASSWORD in
# your shell or .env for anything beyond a laptop.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deploymate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploymate-local}
      POSTGRES_DB: deploymate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploymate"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://deploymate:${POSTGRES_PASSWORD:-deploymate-local}@db:5432/deploymate
      CORS_ORIGINS: http://localhost:8080
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
